[workspace]
members = [
    "crates/dv-cli",
    "crates/dv-core",
    "tools/dv-bench",
    "tools/nuget-plugin-dv-fixture",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22.1"
bytes = "1.11.1"
ctrlc = "3.5.2"
quick-xml = "0.41"
httpdate = "1.0.3"
percent-encoding = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
zeroize = "1.9.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
panic = "abort"
strip = "symbols"
