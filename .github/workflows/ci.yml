name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Build release workspace
        run: cargo build --workspace --release

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run reference benchmark smoke test
        run: cargo run -p dv-bench -- --case sdk_current --samples 1 --warmups 0 --output target/benchmark-smoke.json
      - name: Run compatibility information benchmark smoke test
        run: cargo run -p dv-bench -- --case sdk_current_compat --samples 1 --warmups 0 --output target/benchmark-information-smoke.json
      - name: Run golden CI trace benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_golden_trace --samples 1 --warmups 0 --output target/benchmark-golden-trace-smoke.json
      - name: Run compatibility manifest benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_compat_manifest --samples 1 --warmups 0 --output target/benchmark-compat-manifest-smoke.json
      - name: Run static compatibility check benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_compat_check --samples 1 --warmups 0 --output target/benchmark-compat-check-smoke.json
      - name: Run compatibility help benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_compat_help --samples 1 --warmups 0 --output target/benchmark-compat-help-smoke.json
      - name: Run command normalization benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_command_normalization --samples 1 --warmups 0 --output target/benchmark-command-normalization-smoke.json
      - name: Run child option-effect benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_option_effects --samples 1 --warmups 0 --output target/benchmark-option-effects-smoke.json
      - name: Run dotnet runtime inventory benchmark smoke test
        run: cargo run -p dv-bench -- --case dotnet_runtime_inventory --samples 1 --warmups 0 --output target/benchmark-runtime-inventory-smoke.json
      - name: Run architecture-selected runtime inventory benchmark smoke test
        run: cargo run -p dv-bench -- --case dotnet_runtime_inventory_arch --samples 1 --warmups 0 --output target/benchmark-runtime-inventory-arch-smoke.json
      - name: Run explicit project selection benchmark smoke test
        run: cargo run -p dv-bench -- --case project_select_named --samples 1 --warmups 0 --output target/benchmark-project-selection-smoke.json
      - name: Run workspace discovery benchmark smoke test
        run: cargo run -p dv-bench -- --case workspace_discovery --samples 1 --warmups 0 --output target/benchmark-workspace-discovery-smoke.json
      - name: Run repository root benchmark smoke test
        run: cargo run -p dv-bench -- --case repository_root --samples 1 --warmups 0 --output target/benchmark-repository-root-smoke.json
      - name: Run workspace input benchmark smoke test
        run: cargo run -p dv-bench -- --case workspace_inputs --samples 1 --warmups 0 --output target/benchmark-workspace-inputs-smoke.json
      - name: Run path identity benchmark smoke test
        run: cargo run -p dv-bench -- --case path_identity --samples 1 --warmups 0 --output target/benchmark-path-identity-smoke.json
      - name: Run source link traversal benchmark smoke test
        run: cargo run -p dv-bench -- --case source_link_traversal --samples 1 --warmups 0 --output target/benchmark-source-link-smoke.json
      - name: Run typed transform benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_transform_equivalence --samples 1 --warmups 0 --output target/benchmark-transform-equivalence-smoke.json
      - name: Run invocation mode benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_mode_classification --samples 1 --warmups 0 --output target/benchmark-invocation-mode-smoke.json
      - name: Run exit policy benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_exit_policy --samples 1 --warmups 0 --output target/benchmark-exit-policy-smoke.json
      - name: Run lexical preservation benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_lexical_preservation --samples 1 --warmups 0 --output target/benchmark-lexical-preservation-smoke.json
      - name: Run route precedence benchmark smoke test
        run: cargo run -p dv-bench -- --case cli_route_precedence --samples 1 --warmups 0 --output target/benchmark-route-precedence-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: target/benchmark-*-smoke.json
