name: Phase 1 compatibility trace

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet --version
      - run: dotnet restore SmallConsole.csproj --packages .packages --source offline-source --verbosity quiet
